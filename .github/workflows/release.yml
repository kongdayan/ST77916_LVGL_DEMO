name: Release Firmware

on:
  release:
    types: [published]

jobs:
  build-and-upload:
    name: Build & Upload Firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run

      - name: Package and checksum
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          ARCHIVE="firmware-${VERSION}.zip"

          zip "$ARCHIVE" \
            .pio/build/esp32s3/firmware.bin \
            .pio/build/esp32s3/firmware.elf

          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
          sha256sum .pio/build/esp32s3/firmware.bin >> "${ARCHIVE}.sha256"
          sha256sum .pio/build/esp32s3/firmware.elf >> "${ARCHIVE}.sha256"

          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARCHIVE }}
            ${{ env.ARCHIVE }}.sha256
