name: PR Check

on:
  pull_request:
    branches: ["main"]

jobs:
  # ------------------------------------------------------------------ #
  # Job 1: C/C++ static analysis with cppcheck                          #
  # ui/ is excluded — auto-generated by SquareLine Studio               #
  # ------------------------------------------------------------------ #
  lint:
    name: Lint (cppcheck)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=warning,style,performance,portability \
            --suppress=missingInclude \
            --suppress=unmatchedSuppression \
            --error-exitcode=1 \
            --quiet \
            hal/ screens/ main.cpp

  # ------------------------------------------------------------------ #
  # Job 2: Secret / credential detection with Gitleaks                  #
  # Scans all commits in the PR diff                                     #
  # ------------------------------------------------------------------ #
  secret-scan:
    name: Secret Detection (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------------ #
  # Job 3: Build firmware and report flash / RAM usage                  #
  # Results are posted to the Actions step summary                      #
  # ------------------------------------------------------------------ #
  firmware-size:
    name: Firmware Size Report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio/libdeps
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware
        run: pio run 2>&1 | tee build.log

      - name: Report firmware size
        run: |
          {
            echo "## Firmware Size Report"
            echo ""
            echo "### Memory Usage"
            echo '```'
            grep -E "(RAM:|Flash:|Memory Usage|DATA:|BSS:|TEXT:)" build.log || echo "(size info not found in build log)"
            echo '```'
            echo ""
            echo "### Binary files"
            echo "| File | Size |"
            echo "|------|------|"
            for f in .pio/build/esp32s3/firmware.bin .pio/build/esp32s3/firmware.elf; do
              if [ -f "$f" ]; then
                SIZE=$(du -sh "$f" | cut -f1)
                echo "| \`$f\` | $SIZE |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-pr-${{ github.event.pull_request.number }}-${{ github.sha }}
          path: |
            .pio/build/esp32s3/firmware.bin
            .pio/build/esp32s3/firmware.elf
          retention-days: 7
